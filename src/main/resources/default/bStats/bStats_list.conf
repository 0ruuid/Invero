navList {
    layout = "<X     X>"
    icons {
        X {
            material: AIR
        }
        < {
            material: arrow
            name: "&3Previous Page"
            update: 20
            lore: "Page: {{math add [ page get 1 ]}} / {{math add [ page max 1 ]}}"
            action: [
                page previous
                icon by '<' refresh
                icon by '>' refresh
                sound UI_BUTTON_CLICK by 1 2
            ]
        }
        > {
            material: arrow
            name: "&aNext Page"
            update: 20
            lore: "Page: {{math add [ page get 1 ]}} / {{math add [ page max 1 ]}}"
            action: [
                page next
                icon by '<' refresh
                icon by '>' refresh
                sound UI_BUTTON_CLICK by 1 2
            ]
        }
    }
    generator {
        source: custom
        elements: ${plugins}
        output {
            material: soul lantern
            name: "{{element name}} #{{element id}}"
            sub {
                if: "check &selected_pluginId == &element_id"
                material: lantern
            }
            action: [
                node rest
                
                context set selected_pluginName to element name
                context set selected_pluginId to element id

                sound BLOCK_BARREL_OPEN by 1 2
                menu title update
                icons relocate
                icons update
            ]
        }
    }
}